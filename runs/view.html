<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Document</title>
<link href="../css/style.css" rel="stylesheet"/>
</head>
<body>
<header>
<h1>Chiara's Speedrunning Website</h1>
</header>
<main>
<div class="gameBox">
<div class="gameBoxInside">
<div class="gameBoxInfo">
<div class="gameLogo">
<a href="../index.html"><img alt="logo" src="../images/logo.webp" style="border-radius: 0.5rem;" width="80rem"/></a>
</div>
<div class="gameInfo">
<a href="../index.html"><h2>Super Mario 64 (Mobile)</h2></a>
<strong>Super Mario Series</strong>
<a class="gamePlatform" href="../ce.html">Category Extensions</a>
</div>
</div>
<div class="gameBoxInfo">
<div class="gameMods">
<h3 style="text-align: left;">Leaderboard</h3>
<div class="player">
<img alt="pfp" src="../images/awbryy pfp64.png" style="border-radius: 50%;" width="20%"/><strong class="playerColor awbryy"> awbryy</strong><br/>
</div>
<div class="player">
<img alt="pfp" src="../images/major pfp64.png" style="border-radius: 50%;" width="20%"/><strong class="playerColor major1"> Ma</strong><strong class="playerColor major2">jor</strong><br/>
</div>
</div>
<div class="gameMods">
<h3 style="text-align: left;">Moderators</h3>
<div class="player">
<img alt="pfp" src="../images/chillo pfp64.png" style="border-radius: 50%;" width="11%"/><strong class="playerColor chillo1"> Ch</strong><strong class="playerColor chillo2">illo</strong><br/>
</div>
<div class="player">
<img alt="pfp" src="../images/mercury pfp64.png" style="border-radius: 50%;" width="11%"/><strong class="playerColor mercury"> MercurySpeedruns</strong>
</div>
</div>
</div>
</div>
</div>
<div class="gameBox3"><div class="gameInfo">
<span id="run-breadcrumb" style="margin-top: 1rem; font-size: 0.95rem;"></span>
<p id="run-summary"></p>
</div><iframe allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="" frameborder="0" height="600rem" id="run-video" src="" title="YouTube video player" width="100%"></iframe><div class="statsMain">
<div class="statsInside2">
<h4>Description</h4>
<span id="run-description"></span>
</div>
</div><div class="statsTitle">
<h5>LEADERBOARD</h5>
<h5>RUN</h5>
<h5>DETAILS</h5>
</div><div class="stats">
<div class="statsDivided">
<div class="statsInside">
<span>Category</span><span id="stat-category"></span>
</div>
<div class="statsInside">
<span>Date</span><span id="stat-date"></span>
</div>
</div>
<div class="statsDivided">
<div class="statsInside">
<span>Rank</span><span id="stat-rank"></span>
</div>
<div class="statsInside">
<span>Time</span><span id="stat-time"></span>
</div>
</div>
<div class="statsDivided">
<div class="statsInside">
<span>Player</span><div class="bicolorName" id="stat-player"></div>
</div>
<div class="statsInside">
<span>Verifier</span><div class="bicolorName" id="stat-verifier"></div>
</div>
</div>
</div></div>
</main>
<footer>
<p>Join the SM64 Mobile Speedruning <a href="https://discord.gg/28sytjXMxK"><strong style="color: rgb(84, 134, 209);">Discord Server</strong></a> here</p>
</footer>
<script src="../js/leaderboard.js"></script><script>
    const params = new URLSearchParams(window.location.search);
    const runId = params.get("id");
    if (runId) {
        renderRunDetail(runId);
    } else {
        const summary = document.getElementById("run-summary");
        if (summary) summary.textContent = "Run introuvable.";
    }
</script></body>
</html>
